<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect x="575" y="48" width="770" height="105" rx="18" fill="#000" fill-opacity=".72"/>
  <text x="960" y="122" text-anchor="middle" font-family="Andale Mono, monospace" font-size="64" font-weight="700" fill="#00D4FF" stroke="#000" stroke-width="3" paint-order="stroke">PasswordHasher</text>
  <rect x="65" y="765" width="1790" height="178" rx="20" fill="#000" fill-opacity=".76"/>
  <text x="130" y="840" font-family="Andale Mono, monospace" font-size="43" font-weight="700" fill="#FF5757">password</text>
  <text x="960" y="840" text-anchor="middle" font-family="Andale Mono, monospace" font-size="39" font-weight="700" fill="#fff">await passwordHasher.hash(password)</text>
  <text x="1790" y="905" text-anchor="end" font-family="Andale Mono, monospace" font-size="43" font-weight="700" fill="#00FF41">hashedPassword → DATABASE</text>
