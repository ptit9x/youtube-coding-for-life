<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, height=720">
<title>Hook Overlay — 1 Tỷ Token</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    background: #06060f;
    font-family: 'Anton', sans-serif;
    position: relative;
  }

  /* === BACKGROUND GRADIENT === */
  .bg {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 40%, #0d1a2a 0%, #06060f 70%);
    z-index: 0;
  }

  /* === SCAN LINES === */
  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(255,255,255,0.015) 2px,
      rgba(255,255,255,0.015) 4px
    );
    z-index: 50;
    pointer-events: none;
  }

  /* === FLOATING CODE PARTICLES === */
  .code-particle {
    position: absolute;
    font-family: 'JetBrains Mono', monospace;
    color: #00FF41;
    opacity: 0;
    font-size: 13px;
    z-index: 1;
    white-space: nowrap;
    animation: floatUp 12s linear infinite;
  }

  @keyframes floatUp {
    0%   { opacity: 0; transform: translateY(40px); }
    10%  { opacity: 0.25; }
    50%  { opacity: 0.15; }
    90%  { opacity: 0.05; }
    100% { opacity: 0; transform: translateY(-60px); }
  }

  /* === MAIN CONTENT === */
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    gap: 28px;
  }

  /* === HEADLINE === */
  .headline {
    font-size: 96px;
    font-weight: 900;
    color: #FFFFFF;
    text-transform: uppercase;
    letter-spacing: 4px;
    text-align: center;
    position: relative;
    opacity: 0;
    transform: scale(1.3);
    animation: headlineIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    text-shadow:
      0 0 40px rgba(0, 255, 65, 0.4),
      0 0 80px rgba(0, 255, 65, 0.2),
      0 0 120px rgba(0, 255, 65, 0.1);
    line-height: 1.05;
  }

  .headline .green { color: #00FF41; }

  @keyframes headlineIn {
    0%   { opacity: 0; transform: scale(1.3); filter: blur(8px); }
    60%  { opacity: 1; transform: scale(0.98); filter: blur(0); }
    100% { opacity: 1; transform: scale(1); filter: blur(0); }
  }

  /* === GLITCH EFFECT === */
  .headline::before,
  .headline::after {
    content: attr(data-text);
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
  }

  .headline::before {
    color: #ff004c;
    animation: glitch1 0.15s linear 0.9s 3;
    clip-path: inset(20% 0 40% 0);
  }

  .headline::after {
    color: #00d4ff;
    animation: glitch2 0.15s linear 1.0s 3;
    clip-path: inset(60% 0 10% 0);
  }

  @keyframes glitch1 {
    0%   { opacity: 0.8; transform: translate(-4px, 2px); }
    50%  { opacity: 0.6; transform: translate(4px, -1px); }
    100% { opacity: 0; transform: translate(0); }
  }

  @keyframes glitch2 {
    0%   { opacity: 0.7; transform: translate(3px, -2px); }
    50%  { opacity: 0.5; transform: translate(-5px, 1px); }
    100% { opacity: 0; transform: translate(0); }
  }

  /* === BADGES === */
  .badges {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    margin-top: 10px;
  }

  .badge {
    background: #e8192c;
    color: #FFFFFF;
    font-family: 'Anton', sans-serif;
    font-size: 52px;
    letter-spacing: 3px;
    padding: 10px 40px;
    border-radius: 8px;
    opacity: 0;
    transform: translateX(-120px) scale(0.9);
    box-shadow:
      0 0 30px rgba(232, 25, 44, 0.5),
      0 4px 20px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.15);
    position: relative;
    overflow: hidden;
  }

  .badge::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    animation: shimmer 2s ease-in-out infinite;
    animation-delay: inherit;
  }

  @keyframes shimmer {
    0%, 100% { left: -100%; }
    50%      { left: 150%; }
  }

  .badge-1 {
    animation: badgeSlide 0.6s cubic-bezier(0.16, 1, 0.3, 1) 2.5s forwards;
  }

  .badge-2 {
    animation: badgeSlide 0.6s cubic-bezier(0.16, 1, 0.3, 1) 4.0s forwards;
  }

  @keyframes badgeSlide {
    0%   { opacity: 0; transform: translateX(-120px) scale(0.9); }
    70%  { opacity: 1; transform: translateX(8px) scale(1.02); }
    100% { opacity: 1; transform: translateX(0) scale(1); }
  }

  /* === BADGE PULSE after appearing === */
  .badge-1 { animation: badgeSlide 0.6s cubic-bezier(0.16,1,0.3,1) 2.5s forwards, badgePulse 2s ease-in-out 3.5s infinite; }
  .badge-2 { animation: badgeSlide 0.6s cubic-bezier(0.16,1,0.3,1) 4.0s forwards, badgePulse 2s ease-in-out 5.0s infinite; }

  @keyframes badgePulse {
    0%, 100% { box-shadow: 0 0 30px rgba(232,25,44,0.5), 0 4px 20px rgba(0,0,0,0.6); }
    50%      { box-shadow: 0 0 50px rgba(232,25,44,0.7), 0 4px 30px rgba(0,0,0,0.6); }
  }

  /* === VIGNETTE === */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
    z-index: 40;
    pointer-events: none;
  }

  /* === NEON LINE ACCENT === */
  .neon-line {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00FF41, #00D4FF, #00FF41, transparent);
    z-index: 15;
    animation: lineExpand 1s ease-out 1.5s forwards;
    box-shadow: 0 0 15px #00FF41, 0 0 30px rgba(0,212,255,0.3);
  }

  @keyframes lineExpand {
    to { width: 500px; }
  }

  /* === CORNER DECORATIONS === */
  .corner {
    position: absolute;
    width: 40px;
    height: 40px;
    border-color: #00FF41;
    border-style: solid;
    border-width: 0;
    opacity: 0;
    z-index: 15;
    animation: cornerIn 0.5s ease-out 1.8s forwards;
  }
  .corner-tl { top: 30px; left: 30px; border-top-width: 2px; border-left-width: 2px; }
  .corner-tr { top: 30px; right: 30px; border-top-width: 2px; border-right-width: 2px; }
  .corner-bl { bottom: 30px; left: 30px; border-bottom-width: 2px; border-left-width: 2px; }
  .corner-br { bottom: 30px; right: 30px; border-bottom-width: 2px; border-right-width: 2px; }

  @keyframes cornerIn {
    0%   { opacity: 0; }
    100% { opacity: 0.5; }
  }

  /* === FLOATING GREEN DOTS === */
  .dot {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #00FF41;
    border-radius: 50%;
    z-index: 2;
    opacity: 0;
    animation: dotFloat 6s ease-in-out infinite;
  }

  @keyframes dotFloat {
    0%, 100% { opacity: 0; transform: translateY(0); }
    30%      { opacity: 0.4; }
    50%      { opacity: 0.3; transform: translateY(-30px); }
    70%      { opacity: 0.15; }
  }
</style>
</head>
<body>

  <div class="badges">

</body>
</html>
